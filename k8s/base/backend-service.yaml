# ClusterIP — dışarı açılmaz. Dış trafik yalnızca frontend nginx'inin
# /api/ proxy'si üzerinden gelir.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 5050
      targetPort: http
