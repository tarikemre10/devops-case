apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      # nginx çalışma dizinleri için yazma grubu.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30

      # Replica'ları farklı node'lara yay.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend

      containers:
        - name: nginx
          # ALB deregistration süresini bekle.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          image: mern-client # tag overlay'de `images:` ile verilir
          ports:
            - name: http
              containerPort: 8080 # 80 root gerektirir, non-root nginx 8080'de
          env:
            - name: BACKEND_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BACKEND_UPSTREAM
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run # nginx.pid
            - name: tmp
              mountPath: /tmp
            # entrypoint envsubst çıktısını buraya yazar.
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
