apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
spec:
  serviceName: mongodb
  # Tek replica bilinçli bir tercih (MIMARI.md §3.3): 3 node'lu ReplicaSet +
  # seçim mekanizması bu demonun kapsamını gereksiz büyütür. Prod yolu
  # mongodb-community-operator'dür.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      # mongo imajındaki `mongodb` kullanıcısı uid/gid 999.
      # fsGroup olmadan PVC root sahipli mount edilir ve mongod
      # "Permission denied" ile açılmaz.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:7.0
          args: ["--bind_ip_all"]
          ports:
            - name: mongodb
              containerPort: 27017
          envFrom:
            - secretRef:
                name: mongo-credentials # MONGO_INITDB_ROOT_USERNAME/PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # İlk açılışta init scriptleri + WiredTiger dosyalarının
          # yaratılması yavaş olabilir; startupProbe liveness'ı korur.
          startupProbe:
            exec:
              command:
                ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
            # readOnlyRootFilesystem altında yazılabilir olması gereken yollar.
            # /data/configdb'yi mongod açılışta oluşturmaya çalışır.
            - name: configdb
              mountPath: /data/configdb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # gp3 Terraform'da default StorageClass olarak tanımlı; yine de
        # açıkça yazılıyor ki default değişirse manifest sessizce gp2'ye
        # düşmesin.
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
