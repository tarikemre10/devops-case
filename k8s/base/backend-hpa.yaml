# CPU metriği metrics-server addon'ından gelir (Terraform'da kurulu).
# Ayrıca control plane → node 10251 SG kuralı olmadan metrics-server
# APIService FailedDiscoveryCheck verir ve HPA "unknown" metrikle takılır.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # requests (100m) üzerinden yüzde. %70 = 70m ortalama.
          averageUtilization: 70
  behavior:
    scaleDown:
      # Ani trafik dalgalanmasında sürekli açıp kapamayı (flapping) önler.
      stabilizationWindowSeconds: 300
