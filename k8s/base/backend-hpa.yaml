# CPU metriği Terraform'un kurduğu metrics-server'dan gelir.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # CPU request değerinin yüzdesi.
          averageUtilization: 70
  behavior:
    scaleDown:
      # Ani ölçek küçültmeyi önle.
      stabilizationWindowSeconds: 300
