# Origin doğrulaması: ALB yalnızca CloudFront'un eklediği X-Origin-Verify
# header'ını taşıyan isteklere cevap verir, diğer her şeye 403 döner.
# Header olmadan ALB'nin public DNS'i CloudFront'u (ve dolayısıyla TLS'i)
# tamamen atlatmaya izin verirdi.
#
# __ORIGIN_VERIFY__ yer tutucusu git'te DÜZ METİN DEĞİLDİR; apply'dan önce
# doldurulur:
#   terraform -chdir=terraform/envs/prod output -raw origin_verify_secret
# Aşama 5'te bunu CI adımı yapacak (docs/KARSILASILAN_ZORLUKLAR.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mern-ingress
  annotations:
    # Header eşleşen istekler frontend'e gider.
    alb.ingress.kubernetes.io/conditions.frontend: |
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Origin-Verify","values":["__ORIGIN_VERIFY__"]}}]
    # Eşleşmeyen her şey için sabit cevap. Hedefe hiç ulaşmaz.
    alb.ingress.kubernetes.io/actions.deny-direct: |
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Direct access denied"}}
spec:
  rules:
    - http:
        paths:
          # SIRA ÖNEMLİ: ALB listener kuralları buradaki sırayla üretilir.
          # deny-direct önce gelirse koşullu kural hiç değerlendirilmez ve
          # CloudFront dahil her istek 403 alır.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deny-direct # gerçek Service değil; use-annotation ile eşleşir
                port:
                  name: use-annotation
