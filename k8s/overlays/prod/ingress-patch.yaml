# ALB yalnız CloudFront'un eklediği doğrulama başlığını kabul eder.
# __ORIGIN_VERIFY__ apply sırasında Terraform output'u ile doldurulur.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mern-ingress
  annotations:
    # Doğrulanan istekleri frontend'e gönder.
    alb.ingress.kubernetes.io/conditions.frontend: |
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Origin-Verify","values":["__ORIGIN_VERIFY__"]}}]
    # Diğer istekleri hedefe ulaşmadan reddet.
    alb.ingress.kubernetes.io/actions.deny-direct: |
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Direct access denied"}}
spec:
  rules:
    - http:
        paths:
          # Listener kural sırası korunmalıdır.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deny-direct # gerçek Service değil; use-annotation ile eşleşir
                port:
                  name: use-annotation
