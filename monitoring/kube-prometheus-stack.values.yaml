# EKS'in yönetilen control-plane bileşenlerini scrape etme.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# Prometheus
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 15GB
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Harici PrometheusRule ve ServiceMonitor kaynaklarını seç.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# Alertmanager
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 192Mi
    # Demo ortamında kalıcı alarm geçmişi tutulmaz.
    storage: {}

  # Slack yapılandırılmadığında alarmları null receiver karşılar.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
    receivers:
      - name: "null"

# Grafana
grafana:
  # Admin parolası Terraform Secret'ından gelir.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Yalnız port-forward ile erişilir.
  service:
    type: ClusterIP
  ingress:
    enabled: false

  # Dashboard'lar ConfigMap'ten yüklendiği için kalıcı disk gerekmez.
  persistence:
    enabled: false

  # Grafana başlangıç sırasındaki bellek artışı için 512Mi gerekir.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      jsonData:
        maxLines: 1000

# Exporter'lar
kube-state-metrics:
  # ETL alarmı CronJob ve Job metriklerini kullanır.
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/name]
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 96Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
