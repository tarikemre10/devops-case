# Grafana Alloy — log toplayıcı (Promtail 2 Mart 2026'da EOL oldu, ADR 6).
#
# DİKKAT — DaemonSet DEĞİL, tek replica Deployment:
# `loki.source.kubernetes` log'ları hostPath'ten değil Kubernetes API'sinden
# okur. DaemonSet olarak çalıştırılırsa her node'daki instance TÜM eşleşen
# pod'ları toplar ve aynı satır Loki'ye node sayısı kadar yazılır. Bunu
# önlemenin yolu ya Alloy clustering/sharding ya da tek instance'tır; bu
# ölçekte ikincisi doğru karardır (2 pod slotu da tasarruf edilir).
#
# Bilinen sınır: Alloy pod'u yeniden başlarken kısa bir log boşluğu oluşur.
# Prod yolu (clustering ya da DaemonSet + loki.source.file) README'de not edilir.

controller:
  type: deployment
  replicas: 1

alloy:
  # Metrik toplama Prometheus'un işi; Alloy yalnızca log taşır.
  clustering:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  configMap:
    create: true
    content: |-
      // Yalnızca uygulama ve monitoring namespace'leri. kube-system gürültüsü
      // Loki'yi şişirir ve 10Gi'lık PVC'yi hızla doldurur.
      discovery.kubernetes "pods" {
        role = "pod"

        namespaces {
          names = ["mern", "monitoring"]
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Alloy ve Loki kendi loglarını da üretir; onları geri yazmak sonsuz
        // hacim büyümesi yaratır. Hedef daha kaynağında elenir.
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "alloy|loki"
          action        = "drop"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Uygulama adı (app.kubernetes.io/name) Grafana'da tek filtre olarak
        // kullanılıyor: {app="backend"} gibi sorgular bu label'a dayanır.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        // ETL Job'larının pod adı her koşuda değişir; job_name sabit kalır.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_job_name"]
          target_label  = "job_name"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
