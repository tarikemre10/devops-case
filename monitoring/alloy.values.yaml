# Kubernetes loglarını toplayan Alloy.

controller:
  type: deployment
  replicas: 1

alloy:
  # Alloy yalnızca log taşır.
  clustering:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  configMap:
    create: true
    content: |-
      // Yalnız uygulama ve monitoring loglarını tut.
      discovery.kubernetes "pods" {
        role = "pod"

        namespaces {
          names = ["mern", "monitoring"]
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Alloy ve Loki loglarını geri besleme döngüsünden çıkar.
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "alloy|loki"
          action        = "drop"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Kubernetes uygulama etiketini Loki'ye aktar.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        // ETL koşularını sabit job_name ile grupla.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_job_name"]
          target_label  = "job_name"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
