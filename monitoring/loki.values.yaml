# Loki — tek binary, filesystem storage.
#
# Chart sürümü terraform/envs/prod/variables.tf'te tam pinli (var.loki_version).
# Demo ölçeği: S3 + microservices modu bu case için gereksiz maliyet ve
# hata yüzeyi; tek StatefulSet + gp3 PVC yeterli.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    # SingleBinary'de 3 olamaz; varsayılan 3 bırakılırsa Loki hiç açılmaz.
    replication_factor: 1

  storage:
    type: filesystem

  # schemaConfig AÇIKÇA yazılmalı: güncel chart'lar boş schemaConfig ile
  # başlamayı reddediyor ("schema config is empty" ile CrashLoop).
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 336h # 14 gün (PROJE_PLANI Aşama 6)
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true

  compactor:
    # retention_period tek başına yetmez: silme işini compactor yapar.
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

# SimpleScalable/microservices bileşenleri kapatılır.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Pod slotu ve bellek tasarrufu (3 × t3.medium'da marj dar).
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
