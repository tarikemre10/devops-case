# Demo ortamı için tek binary Loki ve filesystem storage.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    # SingleBinary için replication factor 1 olmalıdır.
    replication_factor: 1

  storage:
    type: filesystem

  # Loki schemaConfig olmadan başlamaz.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 336h # 14 gün
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true

  compactor:
    # Retention temizliğini compactor yapar.
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

# Dağıtık bileşenleri kapat.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Gereksiz cache podlarını kapat.
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
