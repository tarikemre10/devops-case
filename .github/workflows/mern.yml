# MERN build ve deploy pipeline'ı.

name: mern

on:
  push:
    branches: [master]
    paths:
      - "mern-project/**"
      - "docker/Dockerfile.server"
      - "docker/Dockerfile.client"
      - "docker/nginx/**"
      - "docker-compose.yml"
      - ".github/workflows/mern.yml"
  pull_request:
    paths:
      - "mern-project/**"
      - "docker/Dockerfile.server"
      - "docker/Dockerfile.client"
      - "docker/nginx/**"
      - "docker-compose.yml"
      - ".github/workflows/mern.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mern-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  test:
    name: Lint & e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            mern-project/client/package-lock.json

      - name: Client bağımlılıkları
        working-directory: mern-project/client
        run: npm ci

      - name: Client build (lint dahil)
        working-directory: mern-project/client
        env:
          CI: "true"
        run: npm run build

      - name: Client birim testleri
        working-directory: mern-project/client
        env:
          CI: "true"
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Server bağımlılıkları (denetim)
        working-directory: mern-project/server
        run: npm ci

      - name: Yığını ayağa kaldır
        run: docker compose up --build -d

      - name: Cypress e2e
        run: docker compose --profile test run --rm cypress

      - name: Hata çıktılarını yükle
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cypress-artifacts
          path: |
            mern-project/client/cypress/videos
            mern-project/client/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Konteyner logları (hata durumunda)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Temizlik
        if: always()
        run: docker compose down -v --remove-orphans

  build:
    name: Build & push (${{ matrix.image }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mern-server
            dockerfile: docker/Dockerfile.server
            context: mern-project/server
          - image: mern-client
            dockerfile: docker/Dockerfile.client
            context: mern-project/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # Immutable ECR tag'i varsa build'i atla.
      - name: Tag zaten var mı?
        id: exists
        run: |
          if aws ecr describe-images \
                --repository-name "mern-devops-case/${{ matrix.image }}" \
                --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.image }}:${{ github.sha }} ECR'de zaten var, build atlanıyor."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.exists.outputs.skip == 'false'

      - name: Build (local)
        if: steps.exists.outputs.skip == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            nginxconf=docker/nginx
          load: true
          tags: ${{ vars.ECR_REGISTRY }}/mern-devops-case/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy taraması
        if: steps.exists.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ECR_REGISTRY }}/mern-devops-case/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: ECR'ye push
        if: steps.exists.outputs.skip == 'false'
        run: docker push "${{ vars.ECR_REGISTRY }}/mern-devops-case/${{ matrix.image }}:${{ github.sha }}"

  deploy:
    name: Deploy to EKS
    needs: build
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.11

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: İmajları güncelle
        run: |
          set -euo pipefail
          REG="${{ vars.ECR_REGISTRY }}/mern-devops-case"
          kubectl -n mern set image deploy/backend  "backend=$REG/mern-server:${{ github.sha }}"
          kubectl -n mern set image deploy/frontend "nginx=$REG/mern-client:${{ github.sha }}"

      - name: Rollout
        run: |
          set -euo pipefail
          kubectl -n mern rollout status deploy/backend  --timeout=5m
          kubectl -n mern rollout status deploy/frontend --timeout=5m

      # SPA fallback sahte 200 verebildiği için içerik de doğrulanır.
      - name: Smoke test
        run: |
          set -euo pipefail
          BASE="${{ vars.PUBLIC_URL }}"

          for attempt in 1 2 3; do
            ok=true

            ctype=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$BASE/")
            case "$ctype" in
              "200 text/html"*) ;;
              *) echo "frontend: beklenmeyen '$ctype'"; ok=false ;;
            esac

            ctype=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$BASE/api/record")
            case "$ctype" in
              "200 application/json"*) ;;
              *) echo "/api/record: beklenmeyen '$ctype'"; ok=false ;;
            esac

            body=$(curl -sS "$BASE/api/healthcheck/ready")
            if ! echo "$body" | jq -e '.mongo == "up"' >/dev/null 2>&1; then
              echo "/api/healthcheck/ready: $body"
              ok=false
            fi

            if [ "$ok" = true ]; then
              echo "Smoke geçti (deneme $attempt)."
              exit 0
            fi
            sleep 10
          done

          echo "Smoke testi başarısız."
          exit 1

      - name: Geri al
        if: failure()
        run: |
          set -euo pipefail
          kubectl -n mern rollout undo deploy/backend  || true
          kubectl -n mern rollout undo deploy/frontend || true
          kubectl -n mern rollout status deploy/backend  --timeout=5m
          kubectl -n mern rollout status deploy/frontend --timeout=5m
          kubectl -n mern get pods -o wide

      - name: Özet
        if: always()
        run: |
          {
            echo "### Dağıtılan imajlar"
            echo ""
            kubectl -n mern get deploy backend frontend \
              -o custom-columns='DEPLOY:.metadata.name,IMAGE:.spec.template.spec.containers[0].image' \
              --no-headers | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
